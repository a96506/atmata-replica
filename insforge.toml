# Edge functions: none. Phase 2 folded pdf-gen, email-send, ocr-vendor-bill,
# reconciliation-suggest, ai-assistant, erp-scheduler into the Next app.
# Do not `functions deploy` those slugs. Source under functions/ is reference only.
# TOML does not manage function code; this comment documents the contract.

[auth]
allowed_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = true

[auth.password]
min_length = 12
require_number = true
require_lowercase = true
require_uppercase = true
require_special_char = true

[auth.smtp]
enabled = false
host = ""
port = 465
username = ""
sender_email = ""
sender_name = ""
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
